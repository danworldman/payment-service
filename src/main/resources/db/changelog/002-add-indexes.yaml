databaseChangeLog:
  - changeSet:
      id: 2
      author: danworldman
      changes:
        - createIndex:
            collectionName: payments
            keys: '{ "order_id": 1 }'
            options: '{ "name": "idx_order_id", "background": true }'
        - createIndex:
            collectionName: payments
            keys: '{ "user_id": 1 }'
            options: '{ "name": "idx_user_id", "background": true }'
        - createIndex:
            collectionName: payments
            keys: '{ "status": 1 }'
            options: '{ "name": "idx_status", "background": true }'
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_order_id
        - dropIndex:
            collectionName: payments
            indexName: idx_user_id
        - dropIndex:
            collectionName: payments
            indexName: idx_status