spring:
  application:
    name: payment-service
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

mongock:
  migration-scan-package:
    - com.innowise.payment_service.mongock.changelogs
  transaction-enabled: false

management:
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
    kafka:
      enabled: false
    mongo:
      enabled: false