spring:
  application:
    name: payment-service
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false

server:
  port: 8083

mongock:
  migration-scan-package:
    - com.innowise.payment_service.mongock.changelogs
  transaction-enabled: false